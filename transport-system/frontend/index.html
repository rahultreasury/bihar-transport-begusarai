<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bihar Transport Begusarai - Professional logistics and goods transportation services. Book trucks, mini trucks, and pickups online. Pan India services since 1998." />

    <!-- Preconnect early-origin resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" />

    <!-- Preload critical font -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style" />

    <!-- DNS prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />

    <!-- Theme -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="color-scheme" content="light" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Geo -->
    <meta name="geo.region" content="IN-BR" />
    <meta name="geo.placename" content="Begusarai, Bihar" />
    <meta name="geo.position" content="25.4200;85.9900" />
    <meta name="ICBM" content="25.4200, 85.9900" />

    <title>Bihar Transport | Pan India Truck Booking & Logistics Services</title>

    <!-- Google Maps API will be loaded by @react-google-maps/api library -->
  </head>
